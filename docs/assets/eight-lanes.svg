<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="The file is cut into eight pieces that travel at the same time, then are rebuilt and checked with a SHA-256 hash.">
  <defs>
    <style>
      .paper  { fill: #f4eee1; }
      .inkT   { fill: #26221c; }
      .bodyT  { fill: #55493a; }
      .faintT { fill: #8a7f6d; }
      .orangeT{ fill: #d4551f; }
      .serif  { font-family: Georgia, "Times New Roman", serif; }
      .mono   { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
      .box    { fill: #fbf7ec; stroke: #26221c; stroke-width: 1; }
      .shadow { fill: #26221c; opacity: 0.13; }
      .lane   { stroke: #d4551f; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1100" height="330" class="paper"/>

  <text x="550" y="42" text-anchor="middle" class="mono faintT" font-size="12" letter-spacing="4">WHY IT IS QUICK</text>

  <!-- source file -->
  <g transform="translate(60,74)">
    <rect x="5" y="5" width="150" height="196" class="shadow"/>
    <rect width="150" height="196" class="box"/>
    <text x="75" y="30" text-anchor="middle" class="mono faintT" font-size="10" letter-spacing="2">ONE FILE</text>
    <g transform="translate(26,46)">
      <rect width="98" height="132" fill="#fffdf6" stroke="#26221c" stroke-width="1"/>
      <rect y="0"   width="98" height="16.5" fill="#d4551f" opacity="0.92"/>
      <rect y="16.5" width="98" height="16.5" fill="#d4551f" opacity="0.82"/>
      <rect y="33"  width="98" height="16.5" fill="#d4551f" opacity="0.72"/>
      <rect y="49.5" width="98" height="16.5" fill="#d4551f" opacity="0.62"/>
      <rect y="66"  width="98" height="16.5" fill="#d4551f" opacity="0.52"/>
      <rect y="82.5" width="98" height="16.5" fill="#d4551f" opacity="0.42"/>
      <rect y="99"  width="98" height="16.5" fill="#d4551f" opacity="0.32"/>
      <rect y="115.5" width="98" height="16.5" fill="#d4551f" opacity="0.22"/>
    </g>
  </g>

  <!-- eight lanes -->
  <g>
    <text x="550" y="86" text-anchor="middle" class="mono faintT" font-size="10.5" letter-spacing="3">EIGHT PIECES, ALL AT ONCE</text>
    <path d="M 250 108 H 848" class="lane"/>
    <path d="M 250 130 H 848" class="lane"/>
    <path d="M 250 152 H 848" class="lane"/>
    <path d="M 250 174 H 848" class="lane"/>
    <path d="M 250 196 H 848" class="lane"/>
    <path d="M 250 218 H 848" class="lane"/>
    <path d="M 250 240 H 848" class="lane"/>
    <path d="M 250 262 H 848" class="lane"/>
    <path d="M 848 101 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 123 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 145 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 167 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 189 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 211 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 233 l 17 7 l -17 7 z" class="orangeT"/>
    <path d="M 848 255 l 17 7 l -17 7 z" class="orangeT"/>
  </g>

  <!-- rebuilt + verified -->
  <g transform="translate(890,74)">
    <rect x="5" y="5" width="150" height="196" class="shadow"/>
    <rect width="150" height="196" class="box"/>
    <text x="75" y="30" text-anchor="middle" class="mono faintT" font-size="10" letter-spacing="2">REBUILT</text>
    <g transform="translate(26,46)">
      <rect width="98" height="132" fill="#fffdf6" stroke="#26221c" stroke-width="1"/>
      <rect y="0" width="98" height="132" fill="#d4551f" opacity="0.55"/>
      <path d="M 30 66 l 16 18 l 30 -38" fill="none" stroke="#fff7ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="550" y="302" text-anchor="middle" class="serif bodyT" font-size="15">Eight streams at the same time, put back in order, then checked with a SHA-256 hash before you are told it worked.</text>
</svg>
