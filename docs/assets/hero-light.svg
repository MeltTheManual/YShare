<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="YShare. Send anything to anyone.">
  <defs>
    <style>
      .paper { fill: #f4eee1; }
      .ink   { fill: #26221c; }
      .orange{ fill: #d4551f; }
      .muted { fill: #6f6455; }
      .faint { fill: #8a7f6d; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono  { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
      .rule  { stroke: #a99c85; stroke-width: 1; }
      .route { stroke: #a99c85; stroke-width: 1.5; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="340" class="paper"/>
  <rect x="14" y="14" width="1172" height="312" fill="none" stroke="#26221c" stroke-width="1"/>

  <!-- top strip: the brand bar -->
  <rect x="14" y="14" width="1172" height="5" class="orange"/>

  <!-- kicker -->
  <text x="600" y="78" text-anchor="middle" class="mono faint" font-size="13" letter-spacing="5">PEER-TO-PEER FILE SHARING</text>

  <!-- wordmark -->
  <text x="600" y="176" text-anchor="middle" class="serif" font-size="104">
    <tspan class="orange">Y</tspan><tspan class="ink">Share</tspan>
  </text>

  <!-- short rule under the wordmark -->
  <rect x="562" y="198" width="76" height="3" class="orange"/>

  <text x="600" y="238" text-anchor="middle" class="mono muted" font-size="14" letter-spacing="4">SEND ANYTHING TO ANYONE</text>

  <!-- the journey: from you, along a dashed route, to them -->
  <g transform="translate(0,286)">
    <text x="292" y="5" text-anchor="middle" class="mono faint" font-size="11" letter-spacing="3">FROM YOU</text>
    <text x="908" y="5" text-anchor="middle" class="mono faint" font-size="11" letter-spacing="3">TO THEM</text>
    <path d="M 360 0 H 840" class="route"/>
    <circle cx="600" cy="0" r="7" class="orange"/>
    <circle cx="600" cy="0" r="13" fill="none" stroke="#d4551f" stroke-width="1" opacity="0.45"/>
    <circle cx="360" cy="0" r="3.5" class="ink"/>
    <circle cx="840" cy="0" r="3.5" class="ink"/>
  </g>
</svg>
