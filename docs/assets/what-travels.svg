<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-label="Your file goes straight between the two devices. Only a small handshake touches a server, and YShare runs no servers.">
  <defs>
    <style>
      .paper  { fill: #f4eee1; }
      .inkT   { fill: #26221c; }
      .bodyT  { fill: #55493a; }
      .faintT { fill: #8a7f6d; }
      .orangeT{ fill: #d4551f; }
      .serif  { font-family: Georgia, "Times New Roman", serif; }
      .mono   { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
      .box    { fill: #fbf7ec; stroke: #26221c; stroke-width: 1; }
      .shadow { fill: #26221c; opacity: 0.13; }
      .dash   { stroke: #a99c85; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="420" class="paper"/>

  <text x="550" y="46" text-anchor="middle" class="mono faintT" font-size="12" letter-spacing="4">WHAT ACTUALLY GOES WHERE</text>

  <!-- device: sender -->
  <g transform="translate(70,88)">
    <rect x="6" y="6" width="210" height="130" class="shadow"/>
    <rect width="210" height="130" class="box"/>
    <text x="105" y="34" text-anchor="middle" class="mono faintT" font-size="10.5" letter-spacing="3">YOUR DEVICE</text>
    <text x="105" y="76" text-anchor="middle" class="serif inkT" font-size="27">The file</text>
    <text x="105" y="106" text-anchor="middle" class="serif bodyT" font-size="14">stays yours</text>
  </g>

  <!-- device: receiver -->
  <g transform="translate(820,88)">
    <rect x="6" y="6" width="210" height="130" class="shadow"/>
    <rect width="210" height="130" class="box"/>
    <text x="105" y="34" text-anchor="middle" class="mono faintT" font-size="10.5" letter-spacing="3">THEIR DEVICE</text>
    <text x="105" y="76" text-anchor="middle" class="serif inkT" font-size="27">The file</text>
    <text x="105" y="106" text-anchor="middle" class="serif bodyT" font-size="14">arrives whole</text>
  </g>

  <!-- the fat direct pipe -->
  <g transform="translate(0,0)">
    <rect x="292" y="140" width="516" height="30" fill="#d4551f"/>
    <path d="M 808 132 l 26 23 l -26 23 z" class="orangeT"/>
    <path d="M 292 132 l -26 23 l 26 23 z" class="orangeT"/>
    <text x="550" y="160" text-anchor="middle" class="mono" font-size="12.5" fill="#fff7ef" letter-spacing="3">YOUR FILE, ENCRYPTED, DIRECT</text>
    <text x="550" y="196" text-anchor="middle" class="serif bodyT" font-size="15">Every byte goes device to device. No copy is kept anywhere.</text>
  </g>

  <!-- thin line down to the tiny server -->
  <path d="M 300 178 V 258 H 460" class="dash"/>
  <path d="M 800 178 V 258 H 640" class="dash"/>

  <!-- the tiny signaling box -->
  <g transform="translate(460,228)">
    <rect width="180" height="62" fill="#f4eee1" stroke="#a99c85" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="90" y="26" text-anchor="middle" class="mono faintT" font-size="10" letter-spacing="2">INTRODUCTION ONLY</text>
    <text x="90" y="48" text-anchor="middle" class="serif bodyT" font-size="14">a few KB, no file data</text>
  </g>

  <!-- the point -->
  <g transform="translate(0,330)">
    <rect x="230" y="0" width="640" height="58" fill="#fbf7ec" stroke="#26221c" stroke-width="1"/>
    <rect x="230" y="0" width="4" height="58" class="orangeT"/>
    <text x="550" y="26" text-anchor="middle" class="serif inkT" font-size="18">YShare runs none of these servers.</text>
    <text x="550" y="47" text-anchor="middle" class="serif bodyT" font-size="14">You point it at one you trust, or skip it entirely and paste a code by hand.</text>
  </g>
</svg>
